sensor:
  name: kinect2            # kinect2 (базовый) | kinect1 (дешёвая альтернатива) | fake (тесты) | orbbec (будущий аналог)
  # Kinect v2: кадр 512×424, поле зрения 70°×60°, дальность 0,5–4,5 м, USB 3.0
  # (контроллер Intel или Renesas, в порт напрямую, без хаба) плюс свой блок питания.
  # Ось датчика 1,30 м над песком (1,45 м от пола): зона 1,82×1,50 м, 3,6 мм на точку,
  # шум по высоте ≈ 2 мм. Стена попадает в кадр ниже 0,86 м от пола — обрезаем.
  fps: 30
  smoothing_alpha: 0.45    # вес нового кадра; 0,4–0,5 = сглаживание 1–2 кадра (33–66 мс задержки), меньше — плавнее, но медленнее
  hand_mm: 30
  hand_max_rate_mm_s: 150
  hand_dilate_px: 6

latency:
  target_ms: 150           # цель «движение руки — перекраска на песке»; бюджет 130–190: датчик v2 60–70 + USB и фильтры <=10 + сглаживание 33–66 + рендер 16 + проектор 16–40 (game mode)
                           # проверка: снять телефоном 240 к/с и посчитать кадры от движения руки до перекраски

box:
  inner_mm: [1000, 750]
  positions: [floor, table]   # у каждого свой профиль в config/profiles/<name>.json
  active_position: floor
  sand_range_mm: [0, 200]

render:
  display_index: 1
  resolution: [1024, 768]
  fps: 30
  max_color_delta_per_s: 0.5  # ограничитель мерцания

record:
  root: data/sessions
  heightmap_fps: 10
  rgb: {width: 1920, height: 1080, fps: 15, hw: vaapi, bitrate: 4M}
  render: {fps: 15, bitrate: 1500k}
  screenshot_every_s: 30
  segment_s: 60
  min_free_pct_warn: 10
  min_free_pct_block: 3

projector:
  control: pjlink            # pjlink | rs232 | none
  host: 192.168.50.20
  poll_s: 30

console:
  host: 0.0.0.0
  port: 8080
  session_minutes_default: 20
  soft_end_minutes: 2
