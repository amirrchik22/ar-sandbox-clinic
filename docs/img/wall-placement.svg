<text x="176.0" y="612.0" fill="#5d6771" font-size="10.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ось датчика 450 мм от стены — фиксированно, от размера ящика не зависит; край луча здесь 317 мм</text>
<line x1="60.0" y1="626.0" x2="79.2" y2="626.0" stroke="#5d6771" stroke-width="1"/>
<line x1="60.0" y1="622.0" x2="60.0" y2="630.0" stroke="#5d6771"/>
