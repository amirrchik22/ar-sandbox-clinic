<text x="87.2" y="630.0" fill="#5d6771" font-size="10.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">объектив 80 мм от стены; ящик снаружи 20…856 мм (центр 438 мм), зазор под плинтус 20 мм</text>
<text x="42" y="660" fill="#1d232a" font-size="11">Вид сбоку, один масштаб по осям. Стена слева, ребёнок у переднего борта. Размеры от плоскости стены и от пола, мм.</text>
<line x1="60" y1="10" x2="168.0" y2="10" stroke="#5d6771"/><line x1="60" y1="6" x2="60" y2="14" stroke="#5d6771"/><line x1="168.0" y1="6" x2="168.0" y2="14" stroke="#5d6771"/>
<text x="176.0" y="14.0" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">вынос консоли 450 мм — фиксированный, от размера ящика не зависит</text>
<text x="108.0" y="36.4" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">рейка 40×40, три анкера M8, верх 2,30 м; проектор на своей пластине по центру</text>
<text x="113.2" y="60.8" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">проектор объективом вниз, дном к стене, на универсальном кронштейне;</text>
<text x="113.2" y="72.8" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">наклон к стене 2.6°, отношение 1.413, картинка 1.24×0.93 м, страховочный трос</text>
<text x="216.0" y="182.0" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">датчик Kinect v2: ось 450 мм от стены, 1.25 м над песком</text>
<text x="216.0" y="194.0" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">видит 1.75×1.45 м (3.4 мм на точку), стена в кадре ниже 0.67 м</text>
<text x="216.0" y="206.0" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">грань корпуса 416 мм, край луча 317 мм — запас 100 мм, тени нет</text>
<text x="289.4" y="363.2" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ребёнок 5 лет у переднего борта:</text>
<text x="289.4" y="375.2" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">голова вне луча проектора, тени только от рук</text>
<text x="68.0" y="459.2" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ящик на полу: борт 250, фанера 18, песок 150 от пола</text>
<text x="68.0" y="472.4" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">кабель-канал 40×25 рядом с рейкой, вниз к тумбе с ПК</text>
