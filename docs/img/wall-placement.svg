<text x="261.4" y="363.2" fill="#1d232a" font-size="11">ребёнок 5 лет у переднего борта:</text>
<text x="261.4" y="375.2" fill="#1d232a" font-size="11">голова вне луча проектора, тени только от рук</text>
<text x="68.0" y="459.2" fill="#1d232a" font-size="11">ящик на полу: борт 250, фанера 18, песок 150 от пола</text>
