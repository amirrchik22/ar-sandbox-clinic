<text x="113.2" y="72.8" fill="#1d232a" font-size="11">наклон к стене 2.5°, отношение 1.5, картинка 1.2×0.90 м, страховочный трос</text>
<text x="204.1" y="236.0" fill="#1d232a" font-size="11">датчик Kinect v1 над центром ящика, 1.20 м над песком</text>
