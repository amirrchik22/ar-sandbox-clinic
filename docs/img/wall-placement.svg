<text x="176.0" y="612.0" fill="#5d6771" font-size="10.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ось датчика 450 мм от стены — фиксированно, от размера ящика не зависит; край луча здесь 317 мм</text>
<line x1="60.0" y1="626.0" x2="79.2" y2="626.0" stroke="#5d6771" stroke-width="1"/>
<line x1="60.0" y1="622.0" x2="60.0" y2="630.0" stroke="#5d6771"/>
<line x1="79.2" y1="622.0" x2="79.2" y2="630.0" stroke="#5d6771"/>
<text x="87.2" y="630.0" fill="#5d6771" font-size="10.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">объектив 80 мм от стены; песок 20…820 мм от стены (центр 420 мм), зазор под плинтус 20 мм</text>
<text x="42" y="660" fill="#1d232a" font-size="11">Вид сбоку, один масштаб по осям. Стена слева, ребёнок у переднего борта. Размеры от плоскости стены и от пола, мм.</text>
<line x1="60" y1="10" x2="168.0" y2="10" stroke="#5d6771"/><line x1="60" y1="6" x2="60" y2="14" stroke="#5d6771"/><line x1="168.0" y1="6" x2="168.0" y2="14" stroke="#5d6771"/>
<text x="176.0" y="14.0" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">вынос консоли 450 мм — фиксированный, от размера ящика не зависит</text>
<text x="108.0" y="36.4" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">рейка 40×40, три анкера M8, верх 2,30 м; проектор на своей пластине по центру</text>
<text x="113.2" y="60.8" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">проектор объективом вниз, дном к стене, на универсальном кронштейне;</text>
<text x="113.2" y="72.8" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">наклон к стене 2.6°, отношение 1.416, картинка 1.25×0.94 м, страховочный трос</text>
<text x="216.0" y="182.0" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">датчик Kinect v2: ось 450 мм от стены, 1.27 м над песком</text>
<text x="216.0" y="194.0" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">видит 1.78×1.47 м (3.5 мм на точку), стена в кадре ниже 0.67 м</text>
<text x="216.0" y="206.0" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">грань корпуса 416 мм, край луча 317 мм — запас 100 мм, тени нет</text>
<text x="280.8" y="363.2" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ребёнок 5 лет у переднего борта:</text>
<text x="280.8" y="375.2" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">голова вне луча проектора, тени только от рук</text>
<text x="68.0" y="459.2" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ящик на полу, размеры внутренние: 1200×800, борт 300, песок 180</text>
<text x="68.0" y="472.4" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">кабель-канал 40×25 рядом с рейкой, вниз к тумбе с ПК</text>
