<text x="90.0" y="447.2" text-anchor="start" fill="#1d232a" font-size="10.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Проектор на настенной пластине по центру ящика (Y = 0), объектив на 80 мм от стены и 1.95 м от пола.</text>
<text x="90.0" y="461.2" text-anchor="start" fill="#1d232a" font-size="10.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Датчик Kinect v2: ось X = 450 мм от стены, 1.45 м от пола. Вынос фиксированный: от размера ящика (его центр 413 мм) не зависит.</text>
<text x="90.0" y="475.2" text-anchor="start" fill="#1d232a" font-size="10.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Поле 1.82 × 1.50 м (3.6 мм на точку): по глубине от −0.30 (в кадр попадает стена) до +1.20 м, вдоль стены ±910 мм — ящик целиком.</text>
<text x="90.0" y="489.2" text-anchor="start" fill="#1d232a" font-size="10.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Консоль Г-образная: от стены на Y = +300 до X = 450 мм, поперечина оттуда к Y = 0 на той же X — вся вне луча.</text>
<text x="90.0" y="503.2" text-anchor="start" fill="#1d232a" font-size="10.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Луч на высоте консоли: ±133 мм по Y, до 258 мм от стены; на высоте датчика — до 303 мм.</text>
<text x="90.0" y="517.2" text-anchor="start" fill="#1d232a" font-size="10.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Грань корпуса датчика на 416 мм от стены: запас до луча 114 мм. Оранжевое у стены — сечение луча на высоте консоли.</text>
<text x="90.0" y="531.2" text-anchor="start" fill="#1d232a" font-size="10.5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Кабель-канал по стене рядом с рейкой, затем вдоль плинтуса к тумбе; ни одного кабеля ниже 1,3 м в зоне детей.</text>
<text x="410.0" y="588.0" text-anchor="middle" fill="#1d232a" font-size="11" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Вид сверху, масштаб один по осям. Стена сверху. X — от стены, Y — вдоль стены от центра ящика, мм.</text>
