[project]
name = "ar-sandbox-clinic"
version = "0.0.1"
description = "AR-песочница для клиники: сеансы, запись, спокойные режимы"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "pyzmq>=25",
  "zstandard>=0.22",
]

[project.optional-dependencies]
render = ["moderngl>=5.10", "glfw>=2.7", "Pillow>=10"]
console = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "weasyprint>=62"]
kinect1 = ["freenect"]
kinect2 = ["pylibfreenect2"]
orbbec = ["pyorbbecsdk"]
realsense = ["pyrealsense2"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
