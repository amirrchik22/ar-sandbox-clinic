# Описание пакета. Точные версии библиотек — в requirements.txt: именно его
# ставят запускалки (запустить.command, tools/run.sh, tools/run.bat), и он же
# здесь единственный источник правды. Этот файл повторяет тот же список, но
# нижними границами версий — чтобы `pip install -e .` тоже работал.
[project]
name = "ar-sandbox-clinic"
version = "0.0.1"
description = "AR-песочница для клиники: сеансы, запись, спокойные режимы"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",        # вся математика: плоскость, карта высот, раскраска
  "pillow>=10",         # кадр в JPEG для браузера, проектора и снимков
  "fastapi>=0.110",     # веб-сервер: пульт специалиста и страница проекции
  "uvicorn>=0.29",      # запуск веб-сервера
  "pyyaml>=6",          # настройки config/*.yaml
  "zstandard>=0.22",    # сжатие записей занятия (.hmz)
]

# Драйверы датчиков ставятся отдельно и только там, где есть железо: на Маке и
# на Linux это libfreenect2 плюс своя программа захвата (tools/build_grabber.sh),
# на Windows — сборка под Windows, см. README.md.
[project.optional-dependencies]
kinect1 = ["freenect"]
kinect2 = ["pylibfreenect2"]
orbbec = ["pyorbbecsdk"]
realsense = ["pyrealsense2"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
