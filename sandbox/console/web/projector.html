<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23111820%27/%3E%3Cpath d=%27M4 22c4-6 8-6 12 0s8 6 12 0%27 stroke=%27%23d8cb98%27 stroke-width=%273%27 fill=%27none%27/%3E%3Cpath d=%27M4 14c4-6 8-6 12 0s8 6 12 0%27 stroke=%27%2349a8c0%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E">
<title>Проекция — AR-песочница</title>
<style>
  /* Только картинка во весь экран: ни полей, ни интерфейса, чёрный фон.
     Пауза — сплошной чёрный экран (внимание ребёнка переходит на специалиста).
     Заморозка — последний кадр, песок можно трогать, картинка не меняется. */
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #screen { position: fixed; inset: 0; background: #000; }
  #screen img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    display: block;
  }
  #screen img.hidden { opacity: 0; }
  #black { position: fixed; inset: 0; background: #000; z-index: 5; }
  #black[hidden] { display: none; }
  #full {
    position: fixed; right: 18px; bottom: 18px; z-index: 10;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 17px; color: #e9eef6;
    background: rgba(22, 28, 38, 0.85);
    border: 1px solid #2a3442; border-radius: 12px;
    padding: 14px 18px; cursor: pointer;
    transition: opacity 0.4s;
  }
  #full.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="black" hidden></div>
<button id="full">Во весь экран</button>
<script src="/static/live.js"></script>
<script>
  'use strict';

  var live = liveImage(document.getElementById('screen'), '/stream.mjpg', '/frame.jpg', 10);
  var black = document.getElementById('black');
  var paused = false;
  var frozen = false;

  function apply() {
    black.hidden = !paused;
    // Поток не отцепляем даже в паузе: так возврат к картинке мгновенный,
    // а заморозке есть что снять с экрана.
    if (frozen) live.freeze(); else live.thaw();
  }

  function readState(state) {
    var view = state.view || {};
    var p = state.paused != null ? state.paused : view.paused;
    var f = state.frozen != null ? state.frozen : view.frozen;
    paused = !!p;
    frozen = !!f;
    apply();
  }

  // Пауза и заморозка приходят из общего состояния. Старая программа их не
  // присылает — тогда проекция просто всегда живая, без ошибок в консоли.
  function poll() {
    fetch('/api/state').then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (state) {
      if (state) readState(state);
    }).catch(function () {
      // связи нет — попробуем через секунду
    }).then(function () {
      setTimeout(poll, 1000);
    });
  }
  poll();

  var button = document.getElementById('full');
  var timer = null;

  function hideSoon() {
    clearTimeout(timer);
    button.classList.remove('gone');
    timer = setTimeout(function () { button.classList.add('gone'); }, 2500);
  }

  button.onclick = function () {
    var root = document.documentElement;
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (root.requestFullscreen) {
      root.requestFullscreen();
    } else if (root.webkitRequestFullscreen) {
      root.webkitRequestFullscreen();
    }
    hideSoon();
  };

  document.addEventListener('mousemove', hideSoon);
  document.addEventListener('touchstart', hideSoon);
  document.addEventListener('keydown', hideSoon);
  hideSoon();
</script>
</body>
</html>
